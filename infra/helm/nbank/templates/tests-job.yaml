{{- if .Values.tests.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: nbank-tests
  namespace: {{ .Values.namespace.name }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: nbank-tests
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: {{ .Values.tests.image }}
          imagePullPolicy: {{ .Values.tests.imagePullPolicy }}
          command: {{ toJson .Values.tests.command }}
          env:
            - name: server
              value: http://backend:4111
            - name: SERVER
              value: http://backend:4111
            - name: apiVersion
              value: /api/v1
            - name: UI_BASE_URL
              value: http://frontend:80
            - name: PLAYWRIGHT_TEST_BASE_URL
              value: http://frontend:80
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: nbank-postgres-secret
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nbank-postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nbank-postgres-secret
                  key: POSTGRES_PASSWORD
{{- end }}
