apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports:
            - containerPort: 4111
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: nbank-backend-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nbank-postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nbank-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: FRAUD_DETECTION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: nbank-backend-config
                  key: FRAUD_DETECTION_SERVICE_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 4111
            initialDelaySeconds: 45
            periodSeconds: 10